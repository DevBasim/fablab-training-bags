<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الحقائب | فاب لاب الأحساء</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><section id="authView" class="auth-shell"><div class="auth-card"><div class="brand-mark">FL</div><span class="eyebrow">فاب لاب الأحساء</span><h1>إدارة الحقائب التدريبية</h1><p class="muted">صفحة دخول خاصة بمديرة المشاريع.</p><form id="managerForm"><label>البريد الإلكتروني<input id="managerEmail" type="email" required placeholder="manager@fablabalahsa.sa"></label><label>كلمة المرور<input id="managerPassword" type="password" required placeholder="كلمة المرور"></label><button class="primary wide" id="managerSubmit">دخول الإدارة</button></form><div id="authMessage" class="form-message"></div><a href="/" class="link-btn" style="display:block;text-align:center;text-decoration:none;margin-top:14px">العودة لدخول الموظفين</a></div></section><section id="appView" class="app-shell hidden"><main class="main-content"><header class="topbar"><div><span class="eyebrow">لوحة الإدارة</span><h2>إدارة الحقائب التدريبية</h2></div><a href="/" class="secondary">دخول الموظفين</a></header><div class="stats-grid"><div class="stat-card"><span>إجمالي الحقائب</span><strong id="totalCount">0</strong></div><div class="stat-card"><span>مسودات</span><strong id="draftCount">0</strong></div><div class="stat-card"><span>قيد المراجعة</span><strong id="reviewCount">0</strong></div><div class="stat-card"><span>مكتملة</span><strong id="doneCount">0</strong></div></div><div class="section-card"><div class="section-head"><div><h3>جميع الحقائب</h3><p id="userName">متابعة جميع الحقائب.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="secondary" id="exportBtn">تصدير Excel</button><button class="secondary" id="refreshBtn">تحديث</button></div></div><div id="bags" class="bag-list empty">جاري التحميل...</div></div><button id="logoutBtn" class="logout">تسجيل الخروج</button></main></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script><script>const db=supabase.createClient('https://kuuwmzqbzgzfetbpnlsl.supabase.co','sb_publishable_KLJ5ZpuhcXrGwnwTc7CFpw_Csqtd7UF'),$=id=>document.getElementById(id);let allBags=[];function msg(t,e=false){$('authMessage').textContent=t;$('authMessage').style.color=e?'#c04b4b':'#4f7b5c'}function st(s){return s==='submitted'?'قيد المراجعة':s==='needs_revision'?'تحتاج تعديلاً':s==='approved'?'مكتملة':s==='in_progress'?'قيد التنفيذ':'مسودة'}function render(b){$('totalCount').textContent=b.length;$('draftCount').textContent=b.filter(x=>x.status==='draft'||x.status==='in_progress').length;$('reviewCount').textContent=b.filter(x=>x.status==='submitted'||x.status==='needs_revision').length;$('doneCount').textContent=b.filter(x=>x.status==='approved'||Number(x.completion_percent)>=100).length;const c=$('bags');if(!b.length){c.className='bag-list empty';c.textContent='لا توجد حقائب.';return}c.className='bag-list';c.innerHTML=b.map(x=>'<div class="bag-row"><div class="bag-info"><strong>'+String(x.name||'بدون اسم').replace(/[<>]/g,'')+'</strong><span>آخر تحديث: '+new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium'}).format(new Date(x.updated_at))+'</span></div><div class="bag-meta"><span class="badge">'+st(x.status)+'</span><div><div class="progress-mini"><span style="width:'+Math.min(100,Number(x.completion_percent||0))+'%"></span></div><small>'+Math.round(Number(x.completion_percent||0))+'%</small></div></div></div>').join('')}async function load(){const {data,error}=await db.from('training_bags').select('id,name,status,completion_percent,updated_at').order('updated_at',{ascending:false});if(error)return $('bags').textContent='تعذر تحميل الحقائب: '+error.message;allBags=data||[];render(allBags)}
function styleHeaderRow(row){row.eachCell(cell=>{cell.font={bold:true,color:{argb:'FFFFFFFF'},size:12};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF4F7B5C'}};cell.alignment={horizontal:'center',vertical:'middle'};cell.border={bottom:{style:'thin',color:{argb:'FF3A5C46'}}}});row.height=22}
function autoBorder(ws,rowCount){for(let r=2;r<=rowCount;r++){ws.getRow(r).eachCell(cell=>{cell.border={top:{style:'hair',color:{argb:'FFE0E0E0'}},bottom:{style:'hair',color:{argb:'FFE0E0E0'}}};if(r%2===0){cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF7F9F7'}}}})}}
async function exportExcel(){if(!allBags.length){alert('لا توجد بيانات للتصدير حالياً.');return}
const btn=$('exportBtn');btn.disabled=true;const oldText=btn.textContent;btn.textContent='جاري التصدير...';
try{
const groups=[{key:'draft',title:'مسودة'},{key:'in_progress',title:'قيد التنفيذ'},{key:'submitted',title:'قيد المراجعة'},{key:'needs_revision',title:'تحتاج تعديل'},{key:'approved',title:'مكتملة'}];
const wb=new ExcelJS.Workbook();wb.creator='فاب لاب الأحساء';wb.created=new Date();
const summary=wb.addWorksheet('ملخص',{views:[{rightToLeft:true}]});
summary.columns=[{header:'الحالة',key:'status',width:24},{header:'عدد الحقائب',key:'count',width:16}];
styleHeaderRow(summary.getRow(1));
groups.forEach(g=>{const count=allBags.filter(b=>(b.status||'draft')===g.key).length;if(count>0)summary.addRow({status:g.title,count})});
const totalRow=summary.addRow({status:'الإجمالي',count:allBags.length});
totalRow.eachCell(cell=>{cell.font={bold:true};cell.border={top:{style:'medium',color:{argb:'FF4F7B5C'}}}});
summary.getColumn('status').alignment={horizontal:'right'};summary.getColumn('count').alignment={horizontal:'center'};
autoBorder(summary,summary.rowCount-1);
groups.forEach(g=>{
const rows=allBags.filter(b=>(b.status||'draft')===g.key).slice().sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
if(!rows.length)return;
const ws=wb.addWorksheet(g.title,{views:[{rightToLeft:true,state:'frozen',ySplit:1}]});
ws.columns=[{header:'الاسم',key:'name',width:34},{header:'نسبة الإكمال',key:'completion',width:16},{header:'تاريخ آخر تحديث',key:'updated',width:20}];
styleHeaderRow(ws.getRow(1));
rows.forEach(b=>{const row=ws.addRow({name:b.name||'بدون اسم',completion:Math.round(Number(b.completion_percent||0))/100,updated:b.updated_at?new Date(b.updated_at):null});
row.getCell('completion').numFmt='0%';row.getCell('completion').alignment={horizontal:'center'};
row.getCell('updated').numFmt='yyyy-mm-dd hh:mm';row.getCell('updated').alignment={horizontal:'center'};
row.getCell('name').alignment={horizontal:'right'}});
autoBorder(ws,ws.rowCount)});
const buf=await wb.xlsx.writeBuffer();
const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
const url=URL.createObjectURL(blob);const a=document.createElement('a');
const stamp=new Intl.DateTimeFormat('en-CA').format(new Date());
a.href=url;a.download='تصدير_الحقائب_'+stamp+'.xlsx';document.body.appendChild(a);a.click();a.remove();
URL.revokeObjectURL(url)
}catch(err){alert('حدث خطأ أثناء التصدير: '+err.message)}
finally{btn.disabled=false;btn.textContent=oldText}}
async function boot(u){const {data:p}=await db.from('profiles').select('full_name,role').eq('id',u.id).maybeSingle();if(!p||!['project_manager','admin'].includes(p.role)){await db.auth.signOut();return msg('هذا الحساب ليس حساب إدارة.',true)}$('userName').textContent=p.full_name||u.email;$('authView').classList.add('hidden');$('appView').classList.remove('hidden');await load()}$('managerForm').onsubmit=async e=>{e.preventDefault();$('managerSubmit').disabled=true;msg('جاري تسجيل الدخول...');const {data,error}=await db.auth.signInWithPassword({email:$('managerEmail').value.trim().toLowerCase(),password:$('managerPassword').value});$('managerSubmit').disabled=false;if(error)return msg(error.message,true);await boot(data.user)};$('refreshBtn').onclick=load;$('exportBtn').onclick=exportExcel;$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};(async()=>{const {data}=await db.auth.getSession();if(data.session)await boot(data.session.user)})();</script></body></html>
