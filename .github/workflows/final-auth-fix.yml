name: Final auth compatibility patch
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply final auth compatibility patch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="$('managerLoginToggle').onclick=()=>{$('managerAuthForm').classList.toggle('hidden');$('authForm').classList.toggle('hidden')}"
          new="if($('managerLoginToggle'))$('managerLoginToggle').onclick=()=>{$('managerAuthForm').classList.toggle('hidden');$('authForm').classList.toggle('hidden')}"
          if old in s:
              s=s.replace(old,new)
          if 'setupAuth();init();' not in s:
              s=s.replace("$('exportExcel').onclick=exportExcel;", "$('exportExcel').onclick=exportExcel;\nsetupAuth();init();")
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Apply final auth compatibility patch' || true
          git push
          rm -f .github/workflows/final-auth-fix.yml
          git add .github/workflows/final-auth-fix.yml
          git commit -m 'Remove temporary auth patch workflow' || true
          git push