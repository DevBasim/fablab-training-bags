name: Restore original Excel template
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message != 'Restore original Excel template bytes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore template
        env:
          TEMPLATE_B64: ''
        run: |
          printf '%s' "$TEMPLATE_B64" | base64 -d > assets/training-bag-template.xlsx
          unzip -t assets/training-bag-template.xlsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/training-bag-template.xlsx
          git commit -m 'Restore original Excel template bytes'
          git push
