name: Simplify login
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch password login to email OTP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          auth='''<section id="authView" class="auth-shell"><div class="auth-card"><div class="brand-mark">FL</div><span class="eyebrow">فاب لاب الأحساء</span><h1>نظام الحقائب التدريبية</h1><p class="muted">دخول سريع بدون كلمة مرور. اكتب بريدك، اختر القسم، وادخل رمز التحقق.</p><form id="authForm"><label>البريد الإلكتروني<input id="email" type="email" required placeholder="name@fablab.sa" autocomplete="email"></label><label>القسم<select id="authDepartment" required><option value="">جاري تحميل الأقسام...</option></select></label><div id="otpBox" class="hidden"><label>رمز التحقق<input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="أدخل الرمز المرسل إلى بريدك"></label></div><button class="primary wide" id="authSubmit">إرسال رمز الدخول</button></form><button class="link-btn hidden" id="changeEmail" type="button">تغيير البريد أو القسم</button><div id="authMessage" class="form-message"></div></div></section>'''
          s=re.sub(r'<section id="authView".*?</section>',auth,s,count=1,flags=re.S)
          script='''<script>
          (function(){
            let otpSent=false;
            async function waitForDb(){for(let i=0;i<100;i++){if(window.db||typeof db!=='undefined')return;await new Promise(r=>setTimeout(r,100));}}
            function departmentOptions(){const sel=document.getElementById('authDepartment');if(!sel)return;const ds=window.departments||[];sel.innerHTML='<option value="">اختر القسم</option>'+ds.map(d=>`<option value="${d.id}">${String(d.name).replace(/[&<>\\\"]/g,'')}</option>`).join('');const saved=localStorage.getItem('selectedDepartmentId');if(saved&&ds.some(d=>d.id===saved))sel.value=saved;}
            async function setup(){await waitForDb();if(typeof loadDepartments==='function'&&!window.departments?.length)await loadDepartments();departmentOptions();const form=document.getElementById('authForm');if(!form)return;form.onsubmit=async function(e){e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase();const dep=document.getElementById('authDepartment').value;const btn=document.getElementById('authSubmit');const msg=document.getElementById('authMessage');if(!dep){msg.textContent='اختر القسم أولاً';msg.style.color='#c04b4b';return;}btn.disabled=true;try{if(!otpSent){const {error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)throw error;otpSent=true;localStorage.setItem('selectedDepartmentId',dep);document.getElementById('otpBox').classList.remove('hidden');document.getElementById('authDepartment').disabled=true;document.getElementById('email').readOnly=true;document.getElementById('changeEmail').classList.remove('hidden');btn.textContent='دخول';msg.textContent='أرسلنا رمز التحقق إلى بريدك الإلكتروني.';msg.style.color='#4f7b5c';}else{const token=document.getElementById('otp').value.trim();if(!token){msg.textContent='أدخل رمز التحقق';msg.style.color='#c04b4b';return;}const {data,error}=await db.auth.verifyOtp({email,token,type:'email'});if(error)throw error;const ds=window.departments||[];const chosen=ds.find(d=>d.id===dep);if(chosen)window.departments=[chosen,...ds.filter(d=>d.id!==dep)];if(typeof boot==='function')await boot(data.user);}}catch(err){msg.textContent=err.message||'تعذر تسجيل الدخول';msg.style.color='#c04b4b';}finally{btn.disabled=false;}};document.getElementById('changeEmail').onclick=function(){otpSent=false;document.getElementById('otpBox').classList.add('hidden');document.getElementById('authDepartment').disabled=false;document.getElementById('email').readOnly=false;document.getElementById('otp').value='';document.getElementById('authSubmit').textContent='إرسال رمز الدخول';this.classList.add('hidden');};}
            window.addEventListener('load',setup);
          })();
          </script>'''
          marker='<script src="app.js"></script>'
          if 'signInWithOtp' not in s:
              s=s.replace(marker,marker+script)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: simplify login to email OTP and department selection"
          git push
