name: Fix direct employee login
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text()
          # Direct employee login: email is only used as the profile display name.
          # Keep the existing anonymous Supabase session so no verification email is sent.
          patterns=[
            r"const \{data,error\}=await db\.auth\.signInWithOtp\(\{email,options:\{shouldCreateUser:true,emailRedirectTo:window\.location\.origin\+window\.location\.pathname\}\}\);",
            r"const \{data,error\}=await db\.auth\.signInWithOtp\(\{email,options:\{shouldCreateUser:true,emailRedirectTo:[^}]+\}\}\);"
          ]
          replacement="const {data,error}=await db.auth.signInAnonymously({options:{data:{email,display_name:email}}});"
          changed=False
          for pat in patterns:
            ns,n=re.subn(pat,replacement,s,count=1)
            if n:
              s=ns; changed=True; break
          if not changed and 'db.auth.signInWithOtp' in s:
            start=s.index('db.auth.signInWithOtp')
            # Replace the complete call by locating balanced parentheses.
            par=s.index('(',start); depth=0; end=None
            for i in range(par,len(s)):
              if s[i]=='(': depth+=1
              elif s[i]==')':
                depth-=1
                if depth==0:
                  end=i+1; break
            if end:
              s=s[:start]+'db.auth.signInAnonymously({options:{data:{email,display_name:email}}})'+s[end:]
              changed=True
          if not changed:
            print('No OTP call found; leaving app unchanged')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Allow direct employee login without email verification"
          git push
