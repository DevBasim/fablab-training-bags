name: Fix department select
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch department selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('async function wait(){')
          end = s.index("document.getElementById('managerLoginToggle').onclick", start)
          new = '''const departmentOptions=[
            ['3335293c-eae7-42bb-97ad-888f3ecdffb8','الإلكترونيات'],
            ['83781fd9-0356-4624-b0c1-1ba0d1c6e804','الخشب CNC'],
            ['4934cc5d-2587-4aed-90b6-9ddddd541a73','الروبوتات'],
            ['7313aeae-b9da-444b-9283-bf6b6ea454de','الطباعة ثلاثية الأبعاد'],
            ['34bd7cc3-078c-4279-8ef0-809efc6cb519','الليزر'],
            ['5c6bd145-e0be-4554-b9b0-c65a85222fac','كيدز لاب']
          ];
          const dep=document.getElementById('f_department');
          if(dep)dep.innerHTML='<option value="">اختر القسم</option>'+departmentOptions.map(d=>`<option value="${d[0]}">${d[1]}</option>`).join('');
          window.departments=departmentOptions.map(d=>({id:d[0],name:d[1]}));
          '''
          p.write_text(s[:start]+new+s[end:], encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-department-select.yml
          git add index.html .github/workflows/fix-department-select.yml
          git commit -m "fix: populate department selector"
          git push
