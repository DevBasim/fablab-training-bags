name: Fix login now
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-login-now.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove old inline login code and bust app.js cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.find('<script>\n(async function(){')
          if start != -1:
              end=s.find('</script>', start)
              if end == -1:
                  raise SystemExit('Inline script closing tag not found')
              s=s[:start]+s[end+9:]
          s=s.replace('<script src="app.js"></script>','<script src="app.js?v=20260912-2"></script>')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix login handler and refresh app script"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/fix-login-now.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary login fix workflow"
          git push
