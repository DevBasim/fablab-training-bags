name: Fix selected department
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch selected department persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='window.__selectedDepartmentApplied'
          old="await boot(data.user);"
          new="""await boot(data.user);\n            if (dep) {\n              const ds = window.departments || [];\n              const chosen = ds.find(d => d.id === dep);\n              if (chosen) window.departments = [chosen, ...ds.filter(d => d.id !== dep)];\n              window.__selectedDepartmentApplied = true;\n            }"""
          if marker not in s and old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: preserve selected department after login"
          git push || true
