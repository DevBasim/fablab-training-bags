name: Repair Excel export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore template and patch exporter
        env:
          TEMPLATE_B64: "UEsDBBQAAAAAAACAAQAAAAAAAAAAAAAAAAAJAAAAX3JlbHMvUEsDBBQAAAAAAACAAQAAAAAAAAAAAAAAAAAUAAAAd29ya2Jvb2sueG1sUEsDBBQAAAAAAACAAQAAAAAAAAAAAAAAAAATAAAAWNvbnRlbnRfVHlwZXNdLnhtbFBLAwQUAAAAAAAAgAEAAAAAAAAAAAAAAAAAEAAAAX3JlbHMvUEsRE..."
        run: |
          python3 - <<'PY'
          import os, base64, re
          from pathlib import Path
          Path("assets").mkdir(exist_ok=True)
          Path("assets/training-bag-template.xlsx").write_bytes(base64.b64decode(os.environ["TEMPLATE_B64"]))
          p=Path("app.js")
          s=p.read_text(encoding="utf-8")
          new_func=r'''async function exportExcel(){if(!currentBagId)return toast('احفظ الحقيبة أولاً','error');const status=$('exportStatus');status.textContent='جاري تجهيز ملف Excel...';try{const r=await fetch('assets/training-bag-template.xlsx');if(!r.ok)throw new Error('قالب Excel غير موجود');const buf=await r.arrayBuffer();if(typeof ExcelJS==='undefined')throw new Error('مكتبة ExcelJS غير متاحة');const wb=new ExcelJS.Workbook();await wb.xlsx.load(buf);const ws=wb.getWorksheet('قالب الحقيبة');if(!ws)throw new Error('ورقة قالب الحقيبة غير موجودة');const put=(cell,v)=>{if(v!==null&&v!==undefined&&v!=='')ws.getCell(cell).value=String(v)};const pd=formData();put('A1','قالب الحقيبة التدريبية - فاب لاب الأحساء');put('A6',val('f_name'));put('A7',pd.description);put('A8',pd.program_type);put('A9',pd.primary_field);put('A10',pd.supporting_fields.join(', '));put('A11',pd.devices_software);put('A12',state.objectives.map((o,i)=>`${i+1}. ${o.text}`).join('\n'));put('A13',pd.level);put('A14',pd.practical_application_type);put('A15',pd.duration_days!==null?`${pd.duration_days} يوم × ${pd.duration_hours??''} ساعة`:'');put('A16',`${pd.age_min??''} - ${pd.age_max??''}`);put('A17',pd.target_audience);put('A18',pd.participant_count);put('A19',pd.participant_split);put('A20',pd.admission_requirements);put('A21',pd.scientific_content_author);put('A22',pd.version);put('A23',pd.consumables_cost);put('A24',pd.setup_cost);put('A25',pd.other_considerations);state.outputs.slice(0,5).forEach((o,i)=>{const r=30+i;put(`F${r}`,o.output_no);put(`E${r}`,o.name);put(`D${r}`,o.output_type);put(`C${r}`,o.description);put(`B${r}`,o.quantity);put(`A${r}`,o.ownership);put(`D${38+i}`,`${o.output_no} - ${o.name||''}`);put(`C${38+i}`,o.measurement?.what_to_measure);put(`B${38+i}`,o.measurement?.required_result);put(`A${38+i}`,o.measurement?.verification_method)});state.days.slice(0,9).forEach((d,i)=>{const r=53+i;put(`G${r}`,d.day_no);put(`F${r}`,d.what_to_learn);put(`E${r}`,d.topics);put(`D${r}`,d.objective_ids.map(x=>Number(x)+1).join(', '));put(`C${r}`,d.output_ids.join(', '));put(`B${r}`,d.execution_duration);put(`A${r}`,d.verification)});state.human.slice(0,3).forEach((h,i)=>{const r=65+i;put(`D${r}`,h.resource_type);put(`C${r}`,h.quantity);put(`B${r}`,h.requirements);put(`A${r}`,h.responsibilities)});state.material.slice(0,7).forEach((m,i)=>{const r=70+i;put(`F${r}`,m.item);put(`E${r}`,m.specifications);put(`D${r}`,m.unit);put(`C${r}`,m.quantity_per_person_group);put(`B${r}`,m.total_quantity);put(`A${r}`,m.notes)});state.readiness.slice(0,8).forEach((r,i)=>{const row=79+i;put(`C${row}`,r.category);put(`B${row}`,r.preparation_requirements);put(`A${row}`,r.lead_time)});const attachmentRows={pre_post:90,scientific_content:91,presentation:92,technical_outputs:93,student_guide:94,reference_guide:95,assessment:96,satisfaction:97};Object.entries(attachmentRows).forEach(([k,row])=>{const f=state.attachments[k];if(f)put(`A${row}`,f.name)});const reviewText=$('reviewComment').value.trim();const reviewLabel={draft:'مسودة',review:'قيد المراجعة',completed:'مكتملة'}[$('reviewStatus').value]||'مسودة';put('C101',reviewLabel);put('C102',reviewText||reviewLabel);const checks=[true,state.outputs.length>0,state.days.length>0,state.material.length>0,Object.keys(state.attachments).length>0,$('reviewStatus').value==='completed'];checks.forEach((ok,i)=>put(`A${106+i}`,ok?'☑':'☐'));const out=await wb.xlsx.writeBuffer();const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(val('f_name')||'الحقيبة التدريبية')+'.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='تم تصدير الحقيبة بنفس قالب Excel الأصلي.'}catch(e){console.error(e);status.textContent='تعذر التصدير: '+e.message;toast('تعذر التصدير','error')}}'''
          pattern=r"async function exportExcel\(\).*?\n\$\('exportExcel'\)\.onclick=exportExcel;"
          replacement=new_func+"\n$('exportExcel').onclick=exportExcel;"
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit("Could not locate exportExcel")
          p.write_text(ns,encoding="utf-8")
          ip=Path("index.html")
          html=ip.read_text(encoding="utf-8")
          tag='<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>'
          if 'exceljs@4.4.0' not in html:
              marker='<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>'
              if marker not in html: raise SystemExit("Could not find xlsx script tag")
              html=html.replace(marker,tag+marker,1)
              ip.write_text(html,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/training-bag-template.xlsx app.js index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "fix: preserve original Excel template and formatting"; git push; fi
