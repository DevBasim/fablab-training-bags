name: Repair Excel export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore template and patch exporter
        env:
          TEMPLATE_B64: "REPLACE_TEMPLATE"
        run: |
          python3 - <<'PY'
          import os, base64, re
          from pathlib import Path
          Path("assets").mkdir(exist_ok=True)
          Path("assets/training-bag-template.xlsx").write_bytes(base64.b64decode(os.environ["TEMPLATE_B64"]))
          p=Path("app.js")
          s=p.read_text(encoding="utf-8")
          new_func=r'''REPLACE_FUNCTION'''
          pattern=r"async function exportExcel\(\).*?\n\$\('exportExcel'\)\.onclick=exportExcel;"
          replacement=new_func+"\n$('exportExcel').onclick=exportExcel;"
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit("Could not locate exportExcel")
          p.write_text(ns,encoding="utf-8")
          ip=Path("index.html")
          html=ip.read_text(encoding="utf-8")
          tag='<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>'
          if 'exceljs@4.4.0' not in html:
              marker='<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>'
              if marker not in html: raise SystemExit("Could not find xlsx script tag")
              html=html.replace(marker,tag+marker,1)
              ip.write_text(html,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/training-bag-template.xlsx app.js index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "fix: preserve original Excel template and formatting"; git push; fi
