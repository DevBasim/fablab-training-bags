name: Final JS syntax fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken A12 line safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text()
          pattern=r"set\('A12',state\.objectives\.map\(\(o,i\)=>`\$\{i\+1\}\. \$\{o\.text\}`\)\.join\([\s\S]*?\)\);"
          replacement="set('A12',state.objectives.map((o,i)=>String(i+1)+'. '+o.text).join(String.fromCharCode(10)));"
          s2,n=re.subn(pattern,replacement,s,count=1)
          if n!=1:
            raise SystemExit('A12 line not found')
          p.write_text(s2)
          PY
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text().replace('app.js?v=20260912-6','app.js?v=20260912-8').replace('app.js?v=20260912-7','app.js?v=20260912-8')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Fix final JavaScript syntax error'
          git push
          git rm .github/workflows/fix-js-final.yml
          git commit -m 'Remove temporary final JS fix workflow'
          git push
