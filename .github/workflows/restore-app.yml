name: Restore tested app

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore tested app source
        run: |
          git cat-file -p 5d98913e85776d47fef7191ab1d70a69c3862bff > app.js
          sed -i "s#fetch('template.xlsx')#fetch('assets/training-bag-template.xlsx')#" app.js
          cat >> app.js <<'EOF'

// Persistent attachment upload patch
const pendingAttachmentFiles={};
const originalFilePicked=window.filePicked;
window.filePicked=input=>{
  const key=input.dataset.attachment;
  if(input.files&&input.files[0]) pendingAttachmentFiles[key]=input.files[0];
  return originalFilePicked(input);
};
const originalSaveButtonHandler=$('saveBag').onclick;
$('saveBag').onclick=async()=>{
  await originalSaveButtonHandler();
  if(!currentBagId||!currentUser)return;
  const keys=Object.keys(pendingAttachmentFiles);
  if(!keys.length)return;
  try{
    for(const key of keys){
      const file=pendingAttachmentFiles[key];
      const safeName=file.name.replace(/[^a-zA-Z0-9._-\u0600-\u06FF]/g,'_');
      const path=`${currentBagId}/${key}/${crypto.randomUUID()}-${safeName}`;
      const {error:uploadError}=await db.storage.from('training-bag-files').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});
      if(uploadError)throw uploadError;
      const {error:rowError}=await db.from('attachments').insert({bag_id:currentBagId,attachment_type:key,original_filename:file.name,storage_path:path,mime_type:file.type||null,file_size:file.size,uploaded_by:currentUser.id});
      if(rowError)throw rowError;
    }
    Object.keys(pendingAttachmentFiles).forEach(k=>delete pendingAttachmentFiles[k]);
    toast('تم حفظ المرفقات بنجاح');
  }catch(error){
    console.error(error);
    toast('تم حفظ الحقيبة لكن تعذر رفع أحد المرفقات','error');
  }
};
EOF
      - name: Commit restored app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: persist attachments and restore self-contained app [skip ci]'
          git push
