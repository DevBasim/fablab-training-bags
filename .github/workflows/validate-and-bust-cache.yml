name: Validate app and bust JS cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Refresh export asset cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          s=s.replace("assets/training-bag-template.xlsx?v=20260912-6", "assets/training-bag-template.xlsx?v=20260912-9")
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Refresh Excel template cache' || true
          git push
          git rm .github/workflows/validate-and-bust-cache.yml || true
          git commit -m 'Remove temporary validation workflow' || true
          git push
