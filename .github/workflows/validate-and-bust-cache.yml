name: Validate app and bust JS cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Bust browser cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('app.js?v=20260912-6','app.js?v=20260912-7')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust app JavaScript cache after syntax fix' || true
          git push
          git rm .github/workflows/validate-and-bust-cache.yml || true
          git commit -m 'Remove temporary validation workflow' || true
          git push
