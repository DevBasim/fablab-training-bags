name: Fix JS newline syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix broken newline literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          s=s.replace(".join('\\n')", ".join('\\\\n')")
          p.write_text(s)
          PY
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text().replace('app.js?v=20260912-6','app.js?v=20260912-7')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Fix JavaScript newline syntax error'
          git push
          git rm .github/workflows/fix-js-newline.yml
          git commit -m 'Remove temporary JavaScript fix workflow'
          git push
