name: Fix layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CSS layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('styles.css')
          s=p.read_text()
          s=s.replace('.app-shell{min-height:100vh;display:flex}', '.app-shell{min-height:100vh;display:block;overflow-x:hidden}')
          s=s.replace('.main-content{margin-left:250px;width:calc(100% - 250px);padding:28px 34px}', '.main-content{margin-left:250px;width:auto;min-width:0;padding:28px 34px}')
          s=s.replace('.main-content{margin-left:76px;width:calc(100% - 76px);padding:22px}', '.main-content{margin-left:76px;width:auto;min-width:0;padding:22px}')
          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          git commit -m 'Fix responsive app layout' || true
          git push
          git rm .github/workflows/fix-layout.yml || true
          git commit -m 'Remove temporary layout workflow' || true
          git push
