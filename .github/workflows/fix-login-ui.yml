name: Fix login UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure password field in employee login
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'id="password"' not in s:
              marker='<button class="primary wide" id="authSubmit">'
              if marker in s:
                  s=s.replace(marker,'<label>كلمة المرور<input id="password" type="password" required placeholder="كلمة المرور" autocomplete="current-password"></label>'+marker,1)
                  p.write_text(s)
                  print('password field added')
              else:
                  raise SystemExit('login button marker not found')
          else:
              print('password field already present')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show employee password field"
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-login-ui.yml
          git commit -m "Remove temporary login UI workflow"
          git push
