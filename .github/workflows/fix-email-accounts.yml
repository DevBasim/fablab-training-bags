name: Fix email accounts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch employee authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('authSubmit');btn.disabled=true;try{const email=document.getElementById('email').value.trim().toLowerCase();if(!email)throw new Error('اكتب البريد الإلكتروني');const r=await db.auth.signInAnonymously({options:{data:{email,display_name:email}}});if(r.error)throw r.error;localStorage.setItem('loginEmail',email);await boot(r.data.user)}catch(err){authMsg(err.message||'تعذر الدخول. فعّل الدخول المجهول في Supabase.',true)}finally{btn.disabled=false}};"""
          new="""document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('authSubmit');btn.disabled=true;try{const email=document.getElementById('email').value.trim().toLowerCase();if(!email)throw new Error('اكتب البريد الإلكتروني');const r=await db.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:window.location.origin+window.location.pathname}});if(r.error)throw r.error;localStorage.setItem('loginEmail',email);authMsg('تم إرسال رابط الدخول إلى بريدك الإلكتروني. افتحه للمتابعة.')}catch(err){authMsg(err.message||'تعذر إرسال رابط الدخول.',true)}finally{btn.disabled=false}};"""
          if old not in s: raise SystemExit('old employee auth handler not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: make employee login persist by email"
          git push
